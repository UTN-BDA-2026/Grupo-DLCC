<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Tienda Katy</title>
</head>
<body>
    <h2>Control de Acceso - Iniciar Sesión</h2>
    
    <form method="POST" action="/login">
        <label>Nombre de Usuario:</label><br>
        <input type="text" name="username" required><br><br>
        
        <label>Contraseña:</label><br>
        <input type="password" name="password" required><br><br>
        
        <button type="submit">Ingresar al Sistema</button>
    </form>
    <div style="margin-top: 25px; font-family: Arial, sans-serif;">
    <p style="color: #666; margin-bottom: 8px; font-size: 14px;">¿Sos nuevo en el sistema?</p>
    <a href="/registro">
        <button type="button" style="padding: 10px 20px; font-size: 14px; cursor: pointer; background-color: #0288d1; color: white; border: none; border-radius: 5px; font-weight: bold;">
            Crear una Cuenta / Registrarse
        </button>
    </a>
</div>
</body>
</html>
