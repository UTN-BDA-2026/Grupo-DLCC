{% extends "base.html" %}
{% block content %}
<div class="page-hero">
    <div>
        <h2 class="page-title">Nuevo apunte</h2>
    </div>
</div>

<div class="card auth-card">
    <form method="POST">
        <input type="text" name="fecha" placeholder="Fecha (YYYY-MM-DD)" required>
        <input type="text" name="concepto" placeholder="Concepto" required>
        <input type="number" step="0.01" name="monto" placeholder="Monto" required>
        <button type="submit">Guardar</button>
    </form>
</div>
{% endblock %}
